<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>吞金獸回憶錄</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- ☁️ Firebase（新增，不動原本功能） -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: "Segoe UI", Arial;
      background: linear-gradient(135deg, #f5f7fb, #eef2ff);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container { max-width: 900px; margin: auto; }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      transition: 0.25s ease;
      border: 1px solid rgba(0,0,0,0.03);
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.12);
    }

    .full { grid-column: 1 / -1; }

    h3 {
      margin-top: 0;
      font-size: 15px;
      font-weight: 700;
      color: #444;
      position: relative;
      padding-left: 10px;
    }

    h3::before {
      content: "";
      position: absolute;
      left: 0;
      top: 2px;
      width: 4px;
      height: 16px;
      border-radius: 4px;
      background: linear-gradient(180deg, #4CAF50, #2e7d32);
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 6px 0;
      border-radius: 12px;
      border: 1px solid #e5e5e5;
      outline: none;
      transition: 0.2s;
      background: #fff;
    }

    input:focus, select:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 4px rgba(76,175,80,0.12);
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: scale(1.02);
      filter: brightness(1.05);
    }

    .btn-row { display: flex; gap: 10px; }
    .btn-row button { flex: 1; background: linear-gradient(135deg, #607d8b, #455a64); }

    .money-box { line-height: 1.9; font-size: 14px; }

    .negative { color: #e53935; font-weight: 800; }
    .positive { color: #2e7d32; font-weight: 800; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      border-radius: 12px;
      overflow: hidden;
    }

    th { background: #f5f7fb; padding: 10px; font-weight: 700; color: #555; }
    td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }

    tr:hover { background: #f8fbff; }
    canvas { max-height: 260px; }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
    }
  </style>
</head>

<body>

<div class="container">
  <h2>💰 吞金獸回憶錄</h2>

  <div class="grid">

    <div class="card">
      <h3>📅 月份切換</h3>
      <input type="month" id="monthPicker">
    </div>

    <div class="card">
      <h3>預算設定</h3>
      🍱 公司午餐<input type="number" id="limitLunch">
      🧾 雜項<input type="number" id="limitMisc">
      🍜 外食<input type="number" id="limitFood">
      <button onclick="saveLimits()">💾 儲存</button>
    </div>

    <div class="card">
      <h3>新增記帳</h3>
      <input type="date" id="date">
      <select id="category">
        <option value="lunch">公司午餐</option>
        <option value="misc">雜項</option>
        <option value="food">外食</option>
      </select>
      <input type="text" id="item">
      <input type="number" id="amount">
      <input type="text" id="note">
      <button onclick="addRecord()">新增</button>

      <div class="btn-row">
        <button onclick="exportCSV()">📤 匯出CSV</button>
        <button onclick="document.getElementById('fileInput').click()">📥 匯入CSV</button>
      </div>

      <input type="file" id="fileInput" accept=".csv" onchange="importCSV(event)" hidden>
    </div>

    <div class="card money-box">
      <h3>本月剩餘</h3>
      🍱 公司午餐：<span id="totalLunch">0</span><br>
      🧾 雜項：<span id="totalMisc">0</span><br>
      🍜 外食：<span id="totalFood">0</span>
    </div>

    <div class="card full">
      <h3>📊 消費分布</h3>
      <canvas id="pieChart"></canvas>
    </div>

    <div class="card full">
      <h3>📒 我的花錢小日記</h3>
      <table>
        <thead>
          <tr>
            <th>📅 日期</th>
            <th>🍱 分類</th>
            <th>🧾 買了什麼</th>
            <th>💸 花多少</th>
            <th>📝 小備註</th>
            <th>🗑️</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>

  </div>
</div>

<script>

// =============================
// 🔥 Firebase（只新增，不動原本功能）
// =============================
const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT.firebaseio.com",
  projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const cloudRef = db.ref("records");

let records = JSON.parse(localStorage.getItem("records")) || [];
let limits = JSON.parse(localStorage.getItem("limits")) || { lunch:0, misc:0, food:0 };

let currentMonth = new Date().toISOString().slice(0,7);
let chart;

const monthPicker = document.getElementById("monthPicker");
const limitLunch = document.getElementById("limitLunch");
const limitMisc = document.getElementById("limitMisc");
const limitFood = document.getElementById("limitFood");
const date = document.getElementById("date");
const category = document.getElementById("category");
const item = document.getElementById("item");
const amount = document.getElementById("amount");
const note = document.getElementById("note");
const list = document.getElementById("list");
const totalLunch = document.getElementById("totalLunch");
const totalMisc = document.getElementById("totalMisc");
const totalFood = document.getElementById("totalFood");
const pieChart = document.getElementById("pieChart");

monthPicker.value = currentMonth;

// ☁️ 即時同步
cloudRef.on("value", snap => {
  const data = snap.val();
  if (data) {
    records = Object.values(data);
    localStorage.setItem("records", JSON.stringify(records));
    render();
  }
});

monthPicker.addEventListener("change", e => {
  currentMonth = e.target.value;
  render();
});

function save(){ localStorage.setItem("records", JSON.stringify(records)); }

function saveLimits(){
  limits = {
    lunch: Number(limitLunch.value)||0,
    misc: Number(limitMisc.value)||0,
    food: Number(limitFood.value)||0
  };
  localStorage.setItem("limits", JSON.stringify(limits));
  render();
}

function addRecord(){
  if(!date.value||!item.value||!amount.value) return alert("填完整");

  const data = {
    id: Date.now(),
    date: date.value,
    category: category.value,
    item: item.value,
    amount: Number(amount.value),
    note: note.value
  };

  records.push(data);
  save();
  cloudRef.push(data);
  render();
}

function deleteRecord(id){
  // 本地刪除
  records = records.filter(r => r.id !== id);
  save();

  // ☁️ Firebase 刪除（確保型別一致）
  cloudRef.child(String(id)).remove();

  render();
}

// 🔥 強制掛到 window（解決 onclick 無法觸發問題）
window.deleteRecord = deleteRecord;
}

function getName(c){
  return c==="lunch"?"午餐":c==="misc"?"雜項":"外食";
}

function render(){
  list.innerHTML="";
  let l=0,m=0,f=0;

  records.filter(r=>r.date?.startsWith(currentMonth)).forEach(r=>{
    if(r.category=="lunch")l+=r.amount;
    if(r.category=="misc")m+=r.amount;
    if(r.category=="food")f+=r.amount;

    list.innerHTML+=`
      <tr>
        <td>${r.date}</td>
        <td>${getName(r.category)}</td>
        <td>${r.item}</td>
        <td>${r.amount}</td>
        <td>${r.note||""}</td>
        <td><button onclick="deleteRecord(${r.id})">🗑️</button></td>
      </tr>`;
  });

  totalLunch.innerText = limits.lunch - l;
  totalMisc.innerText = limits.misc - m;
  totalFood.innerText = limits.food - f;
}

date.valueAsDate=new Date();
render();

// =============================
// 🔥 SYNC PATCH（不改原本程式，強制全同步）
// =============================

// ❗ 禁止 push 造成分裂（改寫但不動原碼）
cloudRef.push = function(data){
  return cloudRef.child(String(data.id)).set(data);
};

// ❗ 強制刪除同步
const _deleteRecord = deleteRecord;
deleteRecord = function(id){
  cloudRef.child(String(id)).remove();
};

</script>

</body>
</html>
