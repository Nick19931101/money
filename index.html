<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>吞金獸回憶錄</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- ✅ Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

  <style>
    /* 👉 你的原本CSS我沒動 */
    body {
      font-family: "Segoe UI", Arial;
      background: linear-gradient(135deg, #f5f7fb, #eef2ff);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container { max-width: 900px; margin: auto; }
    h2 { text-align: center; margin-bottom: 20px; }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .card { background: white; padding: 18px; border-radius: 14px; box-shadow: 0 6px 18px rgba(0,0,0,0.08); }
    .full { grid-column: 1 / -1; }
    h3 { margin-top: 0; font-size: 16px; border-left: 4px solid #4CAF50; padding-left: 10px; }
    input, select { width: 100%; padding: 10px; margin: 6px 0; border-radius: 10px; border: 1px solid #ddd; }
    button { width: 100%; padding: 10px; margin-top: 8px; border-radius: 10px; border: none; background: #4CAF50; color: white; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { padding: 10px; border-bottom: 1px solid #eee; text-align: center; }
    th { background: #f5f7fb; }
    .negative { color: #e53935; }
    .positive { color: #2e7d32; }
  </style>
</head>

<body>

<div class="container">
  <h2>💰 吞金獸回憶錄</h2>

  <div class="grid">

    <div class="card">
      <h3>月份</h3>
      <input type="month" id="monthPicker">
    </div>

    <div class="card">
      <h3>預算</h3>
      <input type="number" id="limitLunch" placeholder="公司午餐">
      <input type="number" id="limitMisc" placeholder="雜項">
      <input type="number" id="limitFood" placeholder="外食">
      <button onclick="saveLimits()">儲存</button>
    </div>

    <div class="card full">
      <h3>新增記帳</h3>
      <input type="date" id="date">
      <select id="category">
        <option value="lunch">公司午餐</option>
        <option value="misc">雜項</option>
        <option value="food">外食</option>
      </select>
      <input type="text" id="item" placeholder="項目">
      <input type="number" id="amount" placeholder="金額">
      <input type="text" id="note" placeholder="備註">
      <button onclick="addRecord()">新增</button>
    </div>

    <div class="card">
      <h3>剩餘</h3>
      公司午餐：<span id="totalLunch">0</span><br>
      雜項：<span id="totalMisc">0</span><br>
      外食：<span id="totalFood">0</span>
    </div>

    <div class="card full">
      <h3>紀錄</h3>
      <table>
        <tbody id="list"></tbody>
      </table>
    </div>

  </div>
</div>

<script>

/* ===== Supabase 初始化 ===== */
const supabase = window.supabase.createClient(
  "https://zpqrislxzbvytdpfukmk.supabase.co",
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."
);

/* ===== 原本資料 ===== */
let records = JSON.parse(localStorage.getItem("records")) || [];
let limits = JSON.parse(localStorage.getItem("limits")) || {
  lunch: 0, misc: 0, food: 0
};

let currentMonth = new Date().toISOString().slice(0, 7);

/* ===== 雲端讀取 ===== */
async function loadFromCloud() {
  const { data, error } = await supabase.from("records").select("*");

  if (data) {
    records = data;
  }
}

/* ===== 儲存 ===== */
function save() {
  localStorage.setItem("records", JSON.stringify(records));
}

/* ===== 新增 ===== */
async function addRecord() {

  if (!date.value || !item.value || !amount.value) {
    alert("填完整");
    return;
  }

  const newData = {
    date: date.value,
    category: category.value,
    item: item.value,
    amount: Number(amount.value),
    note: note.value
  };

  records.push(newData);

  /* ✅ 上傳雲端 */
  await supabase.from("records").insert([newData]);

  save();
  render();
}

/* ===== render ===== */
function render() {

  list.innerHTML = "";

  let l = 0, m = 0, f = 0;

  records.forEach((r, i) => {

    if (!r.date.startsWith(currentMonth)) return;

    if (r.category === "lunch") l += r.amount;
    if (r.category === "misc") m += r.amount;
    if (r.category === "food") f += r.amount;

    list.innerHTML += `
      <tr>
        <td>${r.date}</td>
        <td>${r.category}</td>
        <td>${r.item}</td>
        <td>${r.amount}</td>
        <td>${r.note || ""}</td>
      </tr>
    `;
  });

  totalLunch.innerText = l;
  totalMisc.innerText = m;
  totalFood.innerText = f;
}

/* ===== 初始化 ===== */
(async () => {
  await loadFromCloud();
  render();
})();

</script>

</body>
</html>
