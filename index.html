<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <!-- ✅ 手機關鍵 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>吞金獸回憶錄</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: "Segoe UI", Arial;
      background: linear-gradient(135deg, #f5f7fb, #eef2ff);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      transition: 0.25s ease;
      border: 1px solid rgba(0,0,0,0.03);
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.12);
    }

    .full {
      grid-column: 1 / -1;
    }

    h3 {
      margin-top: 0;
      font-size: 15px;
      font-weight: 700;
      color: #444;
      position: relative;
      padding-left: 10px;
    }

    h3::before {
      content: "";
      position: absolute;
      left: 0;
      top: 2px;
      width: 4px;
      height: 16px;
      border-radius: 4px;
      background: linear-gradient(180deg, #4CAF50, #2e7d32);
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 6px 0;
      border-radius: 12px;
      border: 1px solid #e5e5e5;
      outline: none;
      transition: 0.2s;
      background: #fff;

      /* ✅ 防 iPhone 放大 */
      font-size: 16px;
    }

    input:focus, select:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 4px rgba(76,175,80,0.12);
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;

      /* ✅ 手機點擊優化 */
      -webkit-tap-highlight-color: transparent;
    }

    button:hover {
      transform: scale(1.02);
      filter: brightness(1.05);
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn-row button {
      flex: 1;
      background: linear-gradient(135deg, #607d8b, #455a64);
    }

    .money-box {
      line-height: 1.9;
      font-size: 14px;
    }

    .negative {
      color: #e53935;
      font-weight: 800;
    }

    .positive {
      color: #2e7d32;
      font-weight: 800;
    }

    /* ✅ 表格滑動 */
    .table-wrapper {
      width: 100%;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      border-radius: 12px;
      overflow: hidden;

      /* ✅ 防爆版 */
      min-width: 600px;
    }

    th {
      background: #f5f7fb;
      padding: 10px;
      font-weight: 700;
      color: #555;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    tr:hover {
      background: #f8fbff;
    }

    canvas {
      max-height: 260px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }

      body {
        padding: 12px;
      }

      h2 {
        font-size: 20px;
      }

      h3 {
        font-size: 14px;
      }

      .card {
        padding: 14px;
      }

      button {
        padding: 12px;
      }

      .btn-row {
        flex-direction: column;
      }

      .money-box {
        font-size: 15px;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h2>💰 吞金獸回憶錄</h2>

  <div class="grid">

    <div class="card">
      <h3>📅 月份切換</h3>
      <input type="month" id="monthPicker">
    </div>

    <div class="card">
      <h3>預算設定</h3>
      🍱 公司午餐<input type="number" id="limitLunch">
      🧾 雜項<input type="number" id="limitMisc">
      🍜 外食<input type="number" id="limitFood">
      <button onclick="saveLimits()">💾 儲存</button>
    </div>

    <div class="card">
      <h3>新增記帳</h3>

      <input type="date" id="date">
      <select id="category">
        <option value="lunch">公司午餐</option>
        <option value="misc">雜項</option>
        <option value="food">外食</option>
      </select>

      <input type="text" id="item" placeholder="項目">
      <input type="number" id="amount" placeholder="金額">
      <input type="text" id="note" placeholder="備註">

      <button onclick="addRecord()">新增</button>

      <div class="btn-row">
        <button onclick="exportCSV()">📤 匯出CSV</button>
        <button onclick="document.getElementById('fileInput').click()">📥 匯入CSV</button>
      </div>

      <input type="file" id="fileInput" accept=".csv" onchange="importCSV(event)" hidden>
    </div>

    <div class="card money-box">
      <h3>本月剩餘</h3>
      🍱 公司午餐：<span id="totalLunch">0</span><br>
      🧾 雜項：<span id="totalMisc">0</span><br>
      🍜 外食：<span id="totalFood">0</span>
    </div>

    <div class="card full">
      <h3>📊 消費分布</h3>
      <canvas id="pieChart"></canvas>
    </div>

    <div class="card full">
      <h3>📒 我的花錢小日記</h3>

      <!-- ✅ 手機滑動 -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>📅 日期</th>
              <th>🍱 分類</th>
              <th>🧾 買了什麼</th>
              <th>💸 花多少</th>
              <th>📝 小備註</th>
              <th>🗑️</th>
            </tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
      </div>

    </div>

  </div>
</div>

<!-- ⚠️ JS 完全沒動 -->
<script>
/* 你的原本 JS 그대로 */
</script>

</body>
</html>
