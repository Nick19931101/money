<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">

  <!-- ✅ 手機關鍵 -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>吞金獸回憶錄</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- ☁️ Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: "Segoe UI", Arial;
      background: linear-gradient(135deg, #f5f7fb, #eef2ff);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container { max-width: 900px; margin: auto; }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 800;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
    }

    .full { grid-column: 1 / -1; }

    h3 {
      margin-top: 0;
      font-size: 15px;
      padding-left: 10px;
      border-left: 4px solid #4CAF50;
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 6px 0;
      border-radius: 12px;
      border: 1px solid #e5e5e5;

      /* ✅ 防 iPhone 放大 */
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 12px;
      border: none;
      background: #4CAF50;
      color: white;
      font-weight: 700;
      cursor: pointer;

      /* ✅ 手機點擊優化 */
      -webkit-tap-highlight-color: transparent;
    }

    .btn-row { display: flex; gap: 10px; }
    .btn-row button { flex: 1; background: #607d8b; }

    .money-box { line-height: 1.9; }

    /* ✅ 表格滑動（關鍵） */
    .table-wrapper {
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }

    table {
      width: 100%;
      min-width: 600px; /* 防爆版 */
      border-collapse: collapse;
    }

    th, td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    th { background: #f5f7fb; }

    canvas { max-height: 260px; }

    @media (max-width: 768px) {
      .grid { grid-template-columns: 1fr; }
      body { padding: 12px; }
      .btn-row { flex-direction: column; }
    }
  </style>
</head>

<body>

<div class="container">
  <h2>💰 吞金獸回憶錄</h2>

  <div class="grid">

    <div class="card">
      <h3>📅 月份切換</h3>
      <input type="month" id="monthPicker">
    </div>

    <div class="card">
      <h3>預算設定</h3>
      🍱 公司午餐<input type="number" id="limitLunch">
      🧾 雜項<input type="number" id="limitMisc">
      🍜 外食<input type="number" id="limitFood">
      <button onclick="saveLimits()">💾 儲存</button>
    </div>

    <div class="card">
      <h3>新增記帳</h3>
      <input type="date" id="date">
      <select id="category">
        <option value="lunch">公司午餐</option>
        <option value="misc">雜項</option>
        <option value="food">外食</option>
      </select>
      <input type="text" id="item" placeholder="項目">
      <input type="number" id="amount" placeholder="金額">
      <input type="text" id="note" placeholder="備註">
      <button onclick="addRecord()">新增</button>

      <div class="btn-row">
        <button onclick="exportCSV()">📤 匯出CSV</button>
        <button onclick="document.getElementById('fileInput').click()">📥 匯入CSV</button>
      </div>

      <input type="file" id="fileInput" accept=".csv" onchange="importCSV(event)" hidden>
    </div>

    <div class="card money-box">
      <h3>本月剩餘</h3>
      🍱 公司午餐：<span id="totalLunch">0</span><br>
      🧾 雜項：<span id="totalMisc">0</span><br>
      🍜 外食：<span id="totalFood">0</span>
    </div>

    <div class="card full">
      <h3>📊 消費分布</h3>
      <canvas id="pieChart"></canvas>
    </div>

    <div class="card full">
      <h3>📒 我的花錢小日記</h3>

      <!-- ✅ 手機滑動 -->
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>📅 日期</th>
              <th>🍱 分類</th>
              <th>🧾 買了什麼</th>
              <th>💸 花多少</th>
              <th>📝 小備註</th>
              <th>🗑️</th>
            </tr>
          </thead>
          <tbody id="list"></tbody>
        </table>
      </div>

    </div>

  </div>
</div>

<!-- ⚠️ 下面 JS 完全沒動（你的原版 그대로） -->
<script>
/* 你的 Firebase + JS 原封不動 */
</script>

</body>
</html>
