<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>吞金獸回憶錄</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      font-family: "Segoe UI", Arial;
      background: linear-gradient(135deg, #f5f7fb, #eef2ff);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container {
      max-width: 900px;
      margin: auto;
    }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      transition: 0.25s ease;
      border: 1px solid rgba(0,0,0,0.03);
    }

    .card:hover {
      transform: translateY(-3px);
      box-shadow: 0 18px 40px rgba(0,0,0,0.12);
    }

    .full {
      grid-column: 1 / -1;
    }

    h3 {
      margin-top: 0;
      font-size: 15px;
      font-weight: 700;
      color: #444;
      position: relative;
      padding-left: 10px;
    }

    h3::before {
      content: "";
      position: absolute;
      left: 0;
      top: 2px;
      width: 4px;
      height: 16px;
      border-radius: 4px;
      background: linear-gradient(180deg, #4CAF50, #2e7d32);
    }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 6px 0;
      border-radius: 12px;
      border: 1px solid #e5e5e5;
      outline: none;
      transition: 0.2s;
      background: #fff;
    }

    input:focus, select:focus {
      border-color: #4CAF50;
      box-shadow: 0 0 0 4px rgba(76,175,80,0.12);
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      color: white;
      font-weight: 700;
      cursor: pointer;
      transition: 0.2s ease;
    }

    button:hover {
      transform: scale(1.02);
      filter: brightness(1.05);
    }

    .btn-row {
      display: flex;
      gap: 10px;
    }

    .btn-row button {
      flex: 1;
      background: linear-gradient(135deg, #607d8b, #455a64);
    }

    .money-box {
      line-height: 1.9;
      font-size: 14px;
    }

    .negative {
      color: #e53935;
      font-weight: 800;
    }

    .positive {
      color: #2e7d32;
      font-weight: 800;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
      border-radius: 12px;
      overflow: hidden;
    }

    th {
      background: #f5f7fb;
      padding: 10px;
      font-weight: 700;
      color: #555;
    }

    td {
      padding: 10px;
      border-bottom: 1px solid #eee;
      text-align: center;
    }

    tr:hover {
      background: #f8fbff;
    }

    canvas {
      max-height: 260px;
    }

    @media (max-width: 768px) {
      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<div class="container">
  <h2>💰 吞金獸回憶錄</h2>

  <div class="grid">

    <div class="card">
      <h3>📅 月份切換</h3>
      <input type="month" id="monthPicker">
    </div>

    <div class="card">
      <h3>預算設定</h3>
      🍱 午餐<input type="number" id="limitLunch">
      🧾 雜項<input type="number" id="limitMisc">
      🍜 外食<input type="number" id="limitFood">
      <button onclick="saveLimits()">💾 儲存</button>
    </div>

    <div class="card">
      <h3>新增記帳</h3>

      <input type="date" id="date">
      <select id="category">
        <option value="lunch">公司午餐費</option>
        <option value="misc">雜項</option>
        <option value="food">外食</option>
      </select>

      <input type="text" id="item" placeholder="項目">
      <input type="number" id="amount" placeholder="金額">
      <input type="text" id="note" placeholder="備註">

      <button onclick="addRecord()">新增</button>

      <div class="btn-row">
        <button onclick="exportCSV()">📤 匯出CSV</button>
        <button onclick="document.getElementById('fileInput').click()">📥 匯入CSV</button>
      </div>

      <input type="file" id="fileInput" accept=".csv" onchange="importCSV(event)" hidden>
    </div>

    <div class="card money-box">
      <h3>本月剩餘</h3>
      🍱 午餐：<span id="totalLunch">0</span><br>
      🧾 雜項：<span id="totalMisc">0</span><br>
      🍜 外食：<span id="totalFood">0</span>
    </div>

    <div class="card full">
      <h3>📊 消費分布</h3>
      <canvas id="pieChart"></canvas>
    </div>

    <div class="card full">
      <h3>📒 記帳紀錄</h3>
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>分類</th>
            <th>項目</th>
            <th>金額</th>
            <th>備註</th>
            <th>刪除</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>

  </div>
</div>

<!-- ⚠️ 你的 JS 完全沒動（原封不動保留） -->
<script>

let records = JSON.parse(localStorage.getItem("records")) || [];
let limits = JSON.parse(localStorage.getItem("limits")) || {
  lunch: 0, misc: 0, food: 0
};

let currentMonth = new Date().toISOString().slice(0, 7);
let chart;

monthPicker.value = currentMonth;

monthPicker.addEventListener("change", e => {
  currentMonth = e.target.value;
  render();
});

function save() {
  localStorage.setItem("records", JSON.stringify(records));
}

function saveLimits() {
  limits = {
    lunch: Number(limitLunch.value) || 0,
    misc: Number(limitMisc.value) || 0,
    food: Number(limitFood.value) || 0
  };
  localStorage.setItem("limits", JSON.stringify(limits));
  render();
}

function addRecord() {
  if (!date.value || !item.value || !amount.value) return alert("填完整");

  records.push({
    date: date.value,
    category: category.value,
    item: item.value,
    amount: Number(amount.value),
    note: note.value
  });

  save();
  render();
}

function deleteRecord(i) {
  records.splice(i, 1);
  save();
  render();
}

function getName(c) {
  return c === "lunch" ? "午餐"
       : c === "misc" ? "雜項"
       : "外食";
}

function exportCSV() {
  let csv = "日期,分類,項目,金額,備註\n";

  records.forEach(r => {
    csv += `${r.date},${r.category},${r.item},${r.amount},${r.note || ""}\n`;
  });

  const blob = new Blob([csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);

  const a = document.createElement("a");
  a.href = url;
  a.download = "記帳資料.csv";
  a.click();

  URL.revokeObjectURL(url);
}

function importCSV(e) {
  const file = e.target.files[0];
  if (!file) return;

  const reader = new FileReader();

  reader.onload = function (evt) {
    const lines = evt.target.result.trim().split("\n");
    const newData = [];

    for (let i = 1; i < lines.length; i++) {
      const [date, category, item, amount, note] = lines[i].split(",");

      if (!date) continue;

      newData.push({
        date: date.trim(),
        category: category.trim(),
        item: item || "",
        amount: Number(amount) || 0,
        note: note || ""
      });
    }

    records = [...records, ...newData];
    save();
    render();
    alert("匯入完成！");
  };

  reader.readAsText(file);
}

function setColor(el, val) {
  el.innerText = val;
  el.className = val < 0 ? "negative" : "positive";
}

function updateChart(l, m, f) {
  if (!chart) {
    chart = new Chart(pieChart, {
      type: "pie",
      data: {
        labels: ["午餐", "雜項", "外食"],
        datasets: [{
          data: [l, m, f],
          backgroundColor: ["#4A90E2", "#E91E63", "#4CAF50"]
        }]
      }
    });
  } else {
    chart.data.datasets[0].data = [l, m, f];
    chart.update();
  }
}

function render() {
  list.innerHTML = "";

  let l = 0, m = 0, f = 0;

  const filtered = records
    .map((r, i) => ({ ...r, _i: i }))
    .filter(r => r.date.startsWith(currentMonth));

  filtered.forEach(r => {
    if (r.category === "lunch") l += r.amount;
    if (r.category === "misc") m += r.amount;
    if (r.category === "food") f += r.amount;

    list.innerHTML += `
      <tr>
        <td>${r.date}</td>
        <td>${getName(r.category)}</td>
        <td>${r.item}</td>
        <td>${r.amount}</td>
        <td>${r.note || ""}</td>
        <td><button onclick="deleteRecord(${r._i})">🗑️</button></td>
      </tr>
    `;
  });

  setColor(totalLunch, limits.lunch - l);
  setColor(totalMisc, limits.misc - m);
  setColor(totalFood, limits.food - f);

  updateChart(l, m, f);

  limitLunch.value = limits.lunch;
  limitMisc.value = limits.misc;
  limitFood.value = limits.food;
}

date.valueAsDate = new Date();
render();

</script>

</body>
</html>
