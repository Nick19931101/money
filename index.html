<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>吞金獸回憶錄</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <!-- ☁️ Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>

  <style>
    body {
      font-family: "Segoe UI", Arial;
      background: linear-gradient(135deg, #f5f7fb, #eef2ff);
      margin: 0;
      padding: 20px;
      color: #333;
    }

    .container { max-width: 900px; margin: auto; }

    h2 {
      text-align: center;
      margin-bottom: 20px;
      font-weight: 800;
      letter-spacing: 1px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
    }

    .card {
      background: white;
      padding: 18px;
      border-radius: 18px;
      box-shadow: 0 12px 30px rgba(0,0,0,0.08);
      transition: 0.25s ease;
    }

    .full { grid-column: 1 / -1; }

    input, select {
      width: 100%;
      box-sizing: border-box;
      padding: 10px;
      margin: 6px 0;
      border-radius: 12px;
      border: 1px solid #e5e5e5;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 8px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #4CAF50, #2e7d32);
      color: white;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-row { display: flex; gap: 10px; }
    .btn-row button { flex: 1; background: linear-gradient(135deg, #607d8b, #455a64); }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 10px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>💰 吞金獸回憶錄</h2>

  <div class="grid">

    <div class="card">
      <h3>📅 月份切換</h3>
      <input type="month" id="monthPicker">
    </div>

    <div class="card">
      <h3>預算設定</h3>
      🍱 公司午餐<input type="number" id="limitLunch">
      🧾 雜項<input type="number" id="limitMisc">
      🍜 外食<input type="number" id="limitFood">
      <button onclick="saveLimits()">💾 儲存</button>
    </div>

    <div class="card">
      <h3>新增記帳</h3>

      <input type="date" id="date">
      <select id="category">
        <option value="lunch">公司午餐</option>
        <option value="misc">雜項</option>
        <option value="food">外食</option>
      </select>

      <!-- ✅ 已幫你加 placeholder -->
      <input type="text" id="item" placeholder="項目">
      <input type="number" id="amount" placeholder="金額">
      <input type="text" id="note" placeholder="備註">

      <button onclick="addRecord()">新增</button>

      <div class="btn-row">
        <button>📤 匯出CSV</button>
        <button>📥 匯入CSV</button>
      </div>
    </div>

    <div class="card">
      <h3>本月剩餘</h3>
      🍱 公司午餐：<span id="totalLunch">0</span><br>
      🧾 雜項：<span id="totalMisc">0</span><br>
      🍜 外食：<span id="totalFood">0</span>
    </div>

    <div class="card full">
      <h3>📒 記帳列表</h3>
      <table>
        <thead>
          <tr>
            <th>日期</th><th>分類</th><th>項目</th><th>金額</th><th>備註</th><th>刪除</th>
          </tr>
        </thead>
        <tbody id="list"></tbody>
      </table>
    </div>

  </div>
</div>

<script>

const firebaseConfig = {
  apiKey: "YOUR_API_KEY",
  authDomain: "YOUR_PROJECT.firebaseapp.com",
  databaseURL: "https://YOUR_PROJECT.firebaseio.com",
  projectId: "YOUR_PROJECT"
};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const cloudRef = db.ref("records");

let records = JSON.parse(localStorage.getItem("records")) || [];
let limits = JSON.parse(localStorage.getItem("limits")) || { lunch:0, misc:0, food:0 };

let currentMonth = new Date().toISOString().slice(0,7);

const monthPicker = document.getElementById("monthPicker");
const date = document.getElementById("date");
const category = document.getElementById("category");
const item = document.getElementById("item");
const amount = document.getElementById("amount");
const note = document.getElementById("note");
const list = document.getElementById("list");

monthPicker.value = currentMonth;

// 即時同步
cloudRef.on("value", snap => {
  const data = snap.val();
  if (data) {
    records = Object.values(data);
    localStorage.setItem("records", JSON.stringify(records));
    render();
  }
});

function save(){
  localStorage.setItem("records", JSON.stringify(records));
}

function addRecord(){
  if(!date.value||!item.value||!amount.value) return alert("填完整");

  const data = {
    id: Date.now(),
    date: date.value,
    category: category.value,
    item: item.value,
    amount: Number(amount.value),
    note: note.value
  };

  records.push(data);
  save();
  cloudRef.child(String(data.id)).set(data);
  render();
}

function deleteRecord(id){
  records = records.filter(r => r.id !== id);
  save();
  cloudRef.child(String(id)).remove();
  render();
}

window.deleteRecord = deleteRecord;

function getName(c){
  return c==="lunch"?"午餐":c==="misc"?"雜項":"外食";
}

function render(){
  list.innerHTML="";
  let l=0,m=0,f=0;

  records.filter(r=>r.date?.startsWith(currentMonth)).forEach(r=>{
    if(r.category=="lunch")l+=r.amount;
    if(r.category=="misc")m+=r.amount;
    if(r.category=="food")f+=r.amount;

    list.innerHTML+=`
      <tr>
        <td>${r.date}</td>
        <td>${getName(r.category)}</td>
        <td>${r.item}</td>
        <td>${r.amount}</td>
        <td>${r.note||""}</td>
        <td><button onclick="deleteRecord(${r.id})">🗑️</button></td>
      </tr>`;
  });

  document.getElementById("totalLunch").innerText = limits.lunch - l;
  document.getElementById("totalMisc").innerText = limits.misc - m;
  document.getElementById("totalFood").innerText = limits.food - f;
}

date.valueAsDate = new Date();
render();

</script>

</body>
</html>
